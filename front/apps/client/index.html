<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#F2690D" />

    <!-- Référencement : ce que Google affiche dans ses résultats -->
    <title>WAYI Bénin – Livraison de repas au Bénin</title>
    <meta name="description" content="Le menu du jour WAYI : des plats labellisés de plusieurs restaurants du Bénin, livrés au petit-déjeuner, déjeuner, dîner et souper." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="application-name" content="WAYI" />
    <meta name="author" content="Hortice ADOGNIBO" />
    <link rel="canonical" href="https://www.wayibenin.com/" />

    <!-- Icônes (Google exige un multiple de 48 px pour l'icône affichée à côté du nom du site) -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Aperçu lors d'un partage (WhatsApp, Facebook, LinkedIn, X...) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WAYI Bénin" />
    <meta property="og:locale" content="fr_BJ" />
    <meta property="og:title" content="WAYI Bénin – Livraison de repas au Bénin" />
    <meta property="og:description" content="Le menu du jour WAYI : des plats labellisés de plusieurs restaurants du Bénin, livrés au petit-déjeuner, déjeuner, dîner et souper." />
    <meta property="og:url" content="https://www.wayibenin.com/" />
    <meta property="og:image" content="https://www.wayibenin.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="WAYI Bénin – livraison de repas" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WAYI Bénin – Livraison de repas au Bénin" />
    <meta name="twitter:description" content="Le menu du jour WAYI : des plats labellisés de plusieurs restaurants du Bénin, livrés." />
    <meta name="twitter:image" content="https://www.wayibenin.com/og-image.png" />

    <!-- Données structurées : disent à Google que « WAYI » = « Wayi Bénin » = ce site -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://www.wayibenin.com/#website",
          "url": "https://www.wayibenin.com/",
          "name": "WAYI",
          "alternateName": ["WAYI Bénin", "Wayi Benin", "wayibenin"],
          "description": "Plateforme de livraison de repas au Bénin : un menu du jour composé de plats labellisés de plusieurs restaurants.",
          "inLanguage": "fr",
          "publisher": { "@id": "https://www.wayibenin.com/#organization" }
        },
        {
          "@type": "Organization",
          "@id": "https://www.wayibenin.com/#organization",
          "name": "WAYI",
          "alternateName": ["WAYI Bénin", "Wayi Benin"],
          "url": "https://www.wayibenin.com/",
          "logo": { "@type": "ImageObject", "url": "https://www.wayibenin.com/icon-512.png", "width": 512, "height": 512 },
          "image": "https://www.wayibenin.com/og-image.png",
          "description": "WAYI livre chaque jour un menu composé de plats labellisés de plusieurs restaurants du Bénin, au petit-déjeuner, au déjeuner, au dîner et au souper.",
          "slogan": "Le goût livré, la qualité certifiée.",
          "founder": { "@type": "Person", "name": "Hortice ADOGNIBO" },
          "areaServed": { "@type": "Country", "name": "Bénin" }
        }
      ]
    }
    </script>
  </head>
  <body>
    <!-- Contenu lisible par Google avant le chargement de l'application (remplacé par React au démarrage) -->
    <div id="root">
      <main style="font-family:system-ui,sans-serif;text-align:center;padding:18vh 24px 0;color:#F2690D">
        <img src="/icon-192.png" width="96" height="96" alt="WAYI Bénin" style="border-radius:22px" />
        <h1 style="font-size:28px;margin:16px 0 6px">WAYI Bénin</h1>
        <p style="font-size:17px;margin:0;color:#444">Livraison de repas au Bénin. Le goût livré, la qualité certifiée.</p>
      </main>
    </div>
    <noscript>WAYI Bénin livre chaque jour un menu de plats labellisés issus de plusieurs restaurants du Bénin. Activez JavaScript pour utiliser l'application.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
