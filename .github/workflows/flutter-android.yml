# Construit l'appli Flutter WAYI (dossier mobile/) et fournit l'APK.
# Onglet Actions > "Appli Flutter WAYI" > Run workflow. Si la compilation echoue,
# le message d'erreur est dans le journal de l'etape "Construire l'APK".
name: Appli Flutter WAYI

on:
  workflow_dispatch:
  push:
    paths: ['mobile/**']

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generer les dossiers Android / iOS
        run: |
          flutter create --platforms=android,ios --org com.wayibenin --project-name wayi .
          dart run tool/patch_platforms.dart
      - name: Dependances
        run: flutter pub get
      - name: Verifier le code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Construire l'APK
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          # Notifications (facultatif) : soit le secret GOOGLE_SERVICES_JSON (contenu du fichier
          # google-services.json telecharge depuis Firebase), soit les 4 secrets FIREBASE_*.
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > /tmp/gs.json
            FIREBASE_PROJECT_ID=$(jq -r '.project_info.project_id' /tmp/gs.json)
            FIREBASE_SENDER_ID=$(jq -r '.project_info.project_number' /tmp/gs.json)
            CLIENT=$(jq -c '[.client[] | select(.client_info.android_client_info.package_name=="com.wayibenin.wayi")][0] // .client[0]' /tmp/gs.json)
            FIREBASE_APP_ID=$(echo "$CLIENT" | jq -r '.client_info.mobilesdk_app_id')
            FIREBASE_API_KEY=$(echo "$CLIENT" | jq -r '.api_key[0].current_key')
            rm -f /tmp/gs.json
          fi
          if [ -n "$FIREBASE_APP_ID" ]; then echo "Notifications : activees (projet $FIREBASE_PROJECT_ID)"; else echo "Notifications : pas de configuration Firebase, APK sans notifications"; fi
          jq -n --arg a "$FIREBASE_API_KEY" --arg b "$FIREBASE_APP_ID" --arg c "$FIREBASE_SENDER_ID" --arg d "$FIREBASE_PROJECT_ID" \
            '{FIREBASE_API_KEY:$a, FIREBASE_APP_ID:$b, FIREBASE_SENDER_ID:$c, FIREBASE_PROJECT_ID:$d}' > firebase.json
          flutter build apk --release --dart-define-from-file=firebase.json

      - uses: actions/upload-artifact@v4
        with:
          name: WAYI-flutter-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
