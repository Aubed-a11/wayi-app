# Construit l'appli Flutter WAYI (dossier mobile/) et fournit l'APK.
# Onglet Actions > "Appli Flutter WAYI" > Run workflow. Si la compilation echoue,
# le message d'erreur est dans le journal de l'etape "Construire l'APK".
name: Appli Flutter WAYI

on:
  workflow_dispatch:
  push:
    paths: ['mobile/**']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generer les dossiers Android / iOS
        run: |
          flutter create --platforms=android,ios --org com.wayibenin --project-name wayi .
          dart run tool/patch_platforms.dart
      - name: Dependances
        run: flutter pub get
      - name: Verifier le code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Construire l'APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: WAYI-flutter-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      # Lien fixe pour telecharger l'appli : https://github.com/Aubed-a11/wayi-app/releases/latest
      - name: Publier l'APK (page Releases)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk WAYI.apk
          TAG=apk-${{ github.run_number }}
          gh release create "$TAG" WAYI.apk --title "WAYI Android (build ${{ github.run_number }})" \
            --notes "Appli WAYI (client, restaurant, livreur). Telecharge WAYI.apk sur le telephone et ouvre-le pour l'installer." --latest
