# Construit l'appli Flutter WAYI (dossier mobile/) et fournit l'APK.
# Onglet Actions > "Appli Flutter WAYI" > Run workflow. Si la compilation echoue,
# le message d'erreur est dans le journal de l'etape "Construire l'APK".
name: Appli Flutter WAYI

on:
  workflow_dispatch:
  push:
    paths: ['mobile/**']

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generer les dossiers Android / iOS
        run: |
          flutter create --platforms=android,ios --org com.wayibenin --project-name wayi .
          dart run tool/patch_platforms.dart
      - name: Dependances
        run: flutter pub get
      - name: Verifier le code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Construire l'APK
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          # Notifications : secrets FIREBASE_* du depot (facultatif)
          printf '{"FIREBASE_API_KEY":"%s","FIREBASE_APP_ID":"%s","FIREBASE_SENDER_ID":"%s","FIREBASE_PROJECT_ID":"%s"}' \
            "$FIREBASE_API_KEY" "$FIREBASE_APP_ID" "$FIREBASE_SENDER_ID" "$FIREBASE_PROJECT_ID" > firebase.json
          flutter build apk --release --dart-define-from-file=firebase.json
      - uses: actions/upload-artifact@v4
        with:
          name: WAYI-flutter-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
