# Met a jour le serveur WAYI (api.wayibenin.com) sur le VPS, depuis GitHub.
# Lancement manuel uniquement : Actions > "Deployer le serveur WAYI" > Run workflow.
# 1. sauvegarde des donnees (si elle echoue, rien n'est modifie)
# 2. copie de l'ancien code, installation du nouveau, redemarrage, verification
# Secrets necessaires (Settings > Secrets and variables > Actions) :
#   VPS_PASSWORD        mot de passe root du VPS
#   VPS_HOST            facultatif (par defaut 76.13.37.17)
#   ANTHROPIC_API_KEY   facultatif : si present, remplace la cle de Yivi dans le .env du serveur
#   Paiement Kkiapay (MTN MoMo, Moov Money, carte), facultatifs, copies dans le .env du serveur :
#   KKIAPAY_PUBLIC_KEY, KKIAPAY_PRIVATE_KEY, KKIAPAY_SECRET, KKIAPAY_WEBHOOK_SECRET
#   KKIAPAY_SANDBOX  true pour les tests (aucun vrai prelevement), false pour l'argent reel
name: Deployer le serveur WAYI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployer-serveur
  cancel-in-progress: false

jobs:
  serveur:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.VPS_HOST || '76.13.37.17' }}
      SSHPASS: ${{ secrets.VPS_PASSWORD }}
      CLAUDE_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      KKIAPAY_PUBLIC_KEY: ${{ secrets.KKIAPAY_PUBLIC_KEY }}
      KKIAPAY_PRIVATE_KEY: ${{ secrets.KKIAPAY_PRIVATE_KEY }}
      KKIAPAY_SECRET: ${{ secrets.KKIAPAY_SECRET }}
      KKIAPAY_WEBHOOK_SECRET: ${{ secrets.KKIAPAY_WEBHOOK_SECRET }}
      KKIAPAY_SANDBOX: ${{ secrets.KKIAPAY_SANDBOX }}
    steps:
      - uses: actions/checkout@v4
      - name: Secret VPS_PASSWORD present ?
        if: env.SSHPASS == ''
        run: |
          echo "Le secret VPS_PASSWORD manque : ajoute-le dans Settings > Secrets and variables > Actions."
          exit 1
      - name: Preparer l'archive du serveur
        run: |
          sudo apt-get install -y -qq sshpass > /dev/null
          tar --exclude=node_modules --exclude=.env --exclude=uploads --exclude=data/sauvegarde \
              -czf wayi-serveur-maj.tgz -C front/backend .
          ls -la wayi-serveur-maj.tgz
      - name: Envoyer sur le VPS
        run: |
          sshpass -e scp -o StrictHostKeyChecking=accept-new wayi-serveur-maj.tgz serveur/sauvegarde-avant-maj.sh root@$HOST:/root/
      - name: 1. Sauvegarder les donnees
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new root@$HOST "sed -i 's/\r$//' /root/sauvegarde-avant-maj.sh && bash /root/sauvegarde-avant-maj.sh"
      - name: 2. Installer et redemarrer
        run: |
          # Reglages a ecrire dans le .env du serveur (seulement ceux fournis en secret)
          : > reglages.env
          for k in KKIAPAY_PUBLIC_KEY KKIAPAY_PRIVATE_KEY KKIAPAY_SECRET KKIAPAY_WEBHOOK_SECRET KKIAPAY_SANDBOX; do
            v="${!k}"; if [ -n "$v" ]; then printf '%s=%s\n' "$k" "$v" >> reglages.env; fi
          done
          if [ -s reglages.env ]; then echo "Reglages Kkiapay fournis : $(cut -d= -f1 reglages.env | tr '\n' ' ')"; fi
          REGLAGES=$(base64 -w0 reglages.env)
          sshpass -e ssh -o StrictHostKeyChecking=accept-new root@$HOST bash -s -- "$CLAUDE_KEY" "$REGLAGES" <<'SCRIPT'
          set -e
          B=/home/wayi/wayi-backend
          cp -r "$B" "$B.sauvegarde-$(date +%Y%m%d-%H%M)"
          cd "$B"
          tar -xzf /root/wayi-serveur-maj.tgz
          touch .env
          if [ -n "$1" ]; then
            sed -i '/^ANTHROPIC_API_KEY=/d;/^ANTHROPIC_MODEL=/d;/^CLAUDE_MODEL=/d' .env
            printf '\nANTHROPIC_API_KEY=%s\nANTHROPIC_MODEL=claude-sonnet-5-5\n' "$1" >> .env
          fi
          if [ -n "$2" ]; then
            echo "$2" | base64 -d > /tmp/reglages.env
            while IFS='=' read -r key val; do
              [ -z "$key" ] && continue
              sed -i "/^${key}=/d" .env
              printf '%s=%s\n' "$key" "$val" >> .env
            done < /tmp/reglages.env
            rm -f /tmp/reglages.env
          fi
          grep -q '^PUBLIC_API_URL=' .env || printf '\nPUBLIC_API_URL=https://api.wayibenin.com\n' >> .env
          chmod 600 .env
          npm install --omit=dev --no-audit --no-fund --silent
          chown -R wayi:wayi "$B"
          wayi-pm2 restart wayi-backend
          sleep 6
          wayi-pm2 logs wayi-backend --lines 25 --nostream
          # On ne garde que les 5 dernieres copies de l'ancien code
          ls -1dt /home/wayi/wayi-backend.sauvegarde-* 2>/dev/null | tail -n +6 | xargs -r rm -rf
          SCRIPT
      - name: 3. Verifier le serveur en ligne
        run: |
          sleep 5
          curl -sf https://api.wayibenin.com/health | head -c 400; echo
          code=$(curl -s -o /dev/null -w '%{http_code}' https://api.wayibenin.com/api/notifications)
          echo "Route des notifications (doit repondre 401, signe que la nouvelle version tourne) : $code"
          echo "Paiement en ligne :"
          curl -s https://api.wayibenin.com/api/payments/methods | head -c 300; echo
          test "$code" = "401"
